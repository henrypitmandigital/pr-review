# .github/workflows/pr-agent.yml
name: Manual PR-Agent review

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  review:
    # Cheap pre-filter; the action re-checks the exact command and author.
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review') &&
      github.event.comment.user.type == 'User'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: profplum700/pr-review/review@v1
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          max-call-usd: ${{ vars.PR_REVIEW_MAX_CALL_USD }}
